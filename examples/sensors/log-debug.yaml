apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: log
spec:
  template:
    container:
      env:
        - name: LOG_LEVEL
          value: info
  dependencies:
    - name: test-dep
      eventSourceName: kafka
      eventName: example
  triggers:
    - template:
        name: log-trigger
        log:
          intervalSeconds: 20
